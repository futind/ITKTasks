databaseChangeLog:
  - changeSet:
      id: 3
      author: Daniil Futin
      labels: "Create users table"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  type: uuid
                  name: id
                  constraints:
                    primaryKey: true
              - column:
                  type: varchar
                  name: full_name
                  constraints:
                    nullable: false
              - column:
                  type: varchar
                  name: email
                  constraints:
                    nullable: false
              - column:
                  type: uuid
                  name: orders
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: orders
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: users_orders_fk_constraint
databaseChangeLog:
  - changeSet:
      id: 2
      author: Daniil Futin
      labels: "Create users table"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  type: uuid
                  name: id
                  constraints:
                    primaryKey: true
              - column:
                  type: varchar
                  name: full_name
                  constraints:
                    nullable: false
              - column:
                  type: varchar
                  name: email
                  constraints:
                    nullable: false
                    unique: true
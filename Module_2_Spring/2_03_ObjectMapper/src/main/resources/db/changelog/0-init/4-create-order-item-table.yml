databaseChangeLog:
  - changeSet:
      id: create-4
      author: "Daniil Futin"
      changes:
        - createTable:
            tableName: order_item
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(15,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: order_item_product_fk_constraint
            baseTableName: order_item
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: order_item_order_fk_constraint
            baseTableName: order_item
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
databaseChangeLog:
  - changeSet:
      id: 2
      author: "Daniil Futin"
      changes:
        - createTable:
            tableName: publishers
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: varchar(255)
                  constraints:
                    nullable: false
databaseChangeLog:
  - changeSet:
      id: 1
      author: "Daniil Futin"
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: fullname
                  type: varchar(255)
                  constraints:
                    nullable: false
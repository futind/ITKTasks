services:
  book-library-db:
    image: postgres:17.6-alpine3.21
    env_file:
      - .env
    ports:
      - "${DB_PORT}:${DB_PORT_INTERNAL}"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - book-library-db-data:/var/lib/postgresql/data

  book-library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-library-app
    env_file:
      - .env
    depends_on:
      - book-library-db
    ports:
      - "${APP_PORT}:${APP_PORT_INTERNAL}"

volumes:
  book-library-db-data:


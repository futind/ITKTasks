services:
  jdbc-library-db:
    image: postgres:17.6-alpine3.21
    env_file: .env
    ports:
      - "${DB_PORT}:${DB_PORT_INTERNAL}"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - jdbc-library-db-data:/var/lib/postgresql/data

  jdbc-library-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    container_name: jdbc-library-app
    depends_on:
      - jdbc-library-db
    ports:
      - "${APP_PORT}:${APP_PORT_INTERNAL}"

volumes:
  jdbc-library-db-data:
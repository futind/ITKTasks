databaseChangeLog:
  - changeSet:
      id: 1
      author: "Daniil Futin"
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: year_of_publication
                  type: int
                  constraints:
                    nullable: false
